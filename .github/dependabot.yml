version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 */3 * * *"
      timezone: Europe/London
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@hono/node-server"
        update-types: ["version-update:semver-major"]
